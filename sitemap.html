        <style>

            svg {
                width: 100%;
                max-width: 1100px;
                height: auto;
                background: whitesmoke;
                border-radius: 10px;
                display: block;
                margin: 0 auto;
                box-shadow:0px 7px 10px #0f8fb2;
                border:2px solid #0f8fb2;
            }

            rect {
                stroke: rgb(167, 217, 240);
                stroke-width: 2;
                cursor: pointer;
            }

            text {
                fill:white;
                font-size: 20px;
                font-weight: bold;
                text-anchor: middle;
                text-align: center;
            }

            .subtext{
                fill:black;
            }

            .line{
                stroke:black;
                stroke-width:3;
            }

            .parent{
                fill:#0f8fb2;
            }

            .parent:hover{
                transition:0.3s;
                stroke-width: 7;
            }

            .child{
                fill:rgb(120, 166, 178);
            }

            .child:hover{
                transition:0.3s;
                stroke-width: 7;
            }

            .content{
                fill:rgb(69, 171, 194);
            }

            .content:hover{
                transition:0.3s;
                stroke-width: 7;
            }

        </style>
